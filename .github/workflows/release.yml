name: release

on:
  push:
    tags: ["v*"]
  # 新仓库首次推 tag 时 Actions 可能还没注册，留个手动入口兜底
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0），手动触发时必填"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 打 tag 即发版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 测试
        run: python -m unittest discover -s tests -v

      - name: 打包
        env:
          MJ_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: python packaging/build_packages.py --verify

      - name: 校验 tag 与代码里的版本一致
        run: |
          version=$(python -c "import sys; sys.path.insert(0,'.'); import mj; print(mj.__version__)")
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          echo "ref=$ref version=$version"
          test "$tag" = "$version" || { echo "::error::$ref 与 mj/__init__.py 的 $version 不一致"; exit 1; }

      - name: 生成固定文件名的 latest 别名
        run: |
          # README 里的「纯命令行安装」用的是 latest/download/<固定名>，
          # 版本号会变，所以每次发版都额外传一份固定名字的拷贝。
          mkdir -p dist-latest
          cp dist/mj-cli_*_all.deb     dist-latest/mj-cli-latest_all.deb
          cp dist/mj-cli-*_noarch.rpm  dist-latest/mj-cli-latest.noarch.rpm
          ls -l dist-latest

      - name: 创建 Release 并上传包
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist-latest/*
          fail_on_unmatched_files: true
          body: |
            **安装**

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i mj-cli_*.deb

            # Fedora / RHEL / Rocky / openSUSE
            sudo rpm -ivh mj-cli-*.rpm
            ```

            装完敲 `mj`（默认静音）或 `MJ`（默认带音乐）回车；想反转用 `--audio` / `--no-audio`。

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
